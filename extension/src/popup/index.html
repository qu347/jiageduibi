<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人国补比价助手</title>
    <style>
      :root { font-family: "Microsoft YaHei", system-ui, sans-serif; color: #172026; }
      body { margin: 0; width: 340px; background: #f5f7f5; }
      main { padding: 20px; }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: white; background: #13795b; font-weight: 800; }
      h1 { margin: 0; font-size: 16px; } header p { margin: 3px 0 0; color: #64716c; font-size: 11px; }
      .status { padding: 10px 12px; border-radius: 10px; background: white; border: 1px solid #dfe6e1; font-size: 12px; }
      label { display: block; margin: 16px 0 7px; font-size: 12px; font-weight: 700; }
      .pair-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      input { min-width: 0; padding: 10px; border: 1px solid #ccd7d0; border-radius: 9px; letter-spacing: .25em; }
      button { border: 0; border-radius: 9px; padding: 10px 13px; color: white; background: #13795b; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      #capture { width: 100%; margin-top: 16px; }
      #message { min-height: 18px; color: #64716c; font-size: 11px; line-height: 1.5; }
      .privacy { margin-top: 16px; color: #64716c; font-size: 10px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <header><span class="mark">比</span><div><h1>国补比价助手</h1><p>只连接本机 127.0.0.1</p></div></header>
      <div id="backend-status" class="status">正在检查本地服务…</div>
      <label for="pairing-code">一次性配对码</label>
      <div class="pair-row">
        <input id="pairing-code" inputmode="numeric" maxlength="6" placeholder="000000" />
        <button id="pair">配对</button>
      </div>
      <p id="message"></p>
      <button id="capture" disabled>采集当前商品页</button>
      <p class="privacy">不会读取 Cookie、浏览历史或密码。只有你点击采集时，扩展才处理当前标签页。</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
